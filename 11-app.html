<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Self-play loss chart</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
    background: var(--color-background-primary, Canvas);
    color: var(--color-text-primary, CanvasText);
    padding: 16px;
  }
  h1 { font-size: 17px; margin: 0 0 4px; }
  .sub { font-size: 13px; opacity: 0.75; margin: 0 0 16px; }
  .chart { display: flex; flex-direction: column; gap: 12px; margin-bottom: 14px; }
  .bar-row { display: flex; flex-direction: column; gap: 4px; cursor: pointer; border: none; background: none; padding: 0; text-align: left; font: inherit; color: inherit; }
  .bar-label { font-size: 13px; display: flex; justify-content: space-between; }
  .bar-value { font-variant-numeric: tabular-nums; font-weight: 600; }
  .bar-track { height: 26px; border-radius: 6px; background: color-mix(in srgb, currentColor 10%, transparent); overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 6px; background: var(--color-background-inverse, #6b7280); opacity: 0.85; transition: width 0.4s ease, opacity 0.2s; }
  .bar-row.selected .bar-fill { opacity: 1; outline: 2px solid var(--color-border-info, #3b82f6); outline-offset: 1px; }
  .toggle { display: flex; gap: 8px; margin-bottom: 14px; }
  .toggle button {
    border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
    background: none; color: inherit; border-radius: 999px; padding: 5px 12px; font-size: 12.5px; cursor: pointer;
  }
  .toggle button.active { background: var(--color-background-inverse, #374151); color: var(--color-text-inverse, #fff); border-color: transparent; }
  .detail { font-size: 13px; line-height: 1.5; border-left: 3px solid var(--color-border-info, #3b82f6); padding: 6px 10px; margin-bottom: 12px; }
  .caveat { font-size: 12px; opacity: 0.65; line-height: 1.5; }
  .loading { opacity: 0.6; font-size: 14px; }
</style>
</head>
<body>
<main id="root"><p class="loading">Loading chart…</p></main>
<script>/*APP_JS*/</script>
</body>
</html>
